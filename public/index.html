<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07121d"><title>METEORS ENERGY | CRM</title><style>
:root{color-scheme:dark;--bg:#07121d;--panel:#101f2c;--panel2:#142737;--line:#23394a;--muted:#8da4b5;--text:#eaf4f8;--teal:#20c5b5;--green:#80d68c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0,#10333c 0,transparent 35%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui}button,input,select,textarea{font:inherit}button{cursor:pointer}.layout{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{padding:24px 16px;border-right:1px solid var(--line);background:#081722}.brand{font-size:17px;font-weight:800;letter-spacing:1px;margin:4px 8px 30px}.brand span{color:var(--teal)}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#a9bdca;text-align:left;padding:12px;border-radius:9px}.nav button.active,.nav button:hover{background:#153442;color:#fff}.main{padding:28px;max-width:1500px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:26px}.eyebrow{color:var(--teal);font-size:11px;letter-spacing:2px;font-weight:800}.muted{color:var(--muted)}h1{font-size:26px;margin:5px 0}.btn{border:1px solid var(--line);background:var(--panel2);color:white;padding:10px 14px;border-radius:8px}.btn.primary{background:linear-gradient(120deg,#0c9f9a,#187c66);border:0}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card,.panel{background:linear-gradient(145deg,#122432,#0e1c28);border:1px solid var(--line);border-radius:13px;padding:18px}.metric{font-size:27px;font-weight:800;margin:9px 0}.metric-label{color:var(--muted)}.panel{margin-top:18px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h2{font-size:16px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px}td{font-size:13px}.pill{border-radius:30px;background:#183e42;color:#83e2d4;padding:5px 9px;font-size:11px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.bar{height:8px;background:#1d3442;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--green))}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label{color:var(--muted);font-size:12px}.field input,.field select,.field textarea,.search{width:100%;padding:11px;background:#091722;border:1px solid var(--line);color:white;border-radius:8px}.field textarea{min-height:75px}.modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}.dialog{width:min(650px,100%);max-height:90vh;overflow:auto;background:#102230;border:1px solid var(--line);border-radius:15px;padding:22px}.toast{position:fixed;bottom:20px;right:20px;background:#17483e;padding:12px 18px;border-radius:9px;display:none}.empty{padding:30px;text-align:center;color:var(--muted)}.login{max-width:420px;margin:10vh auto;padding:28px}.hide{display:none!important}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--line);padding:12px}.brand{margin:5px 8px 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr;gap:8px}.card{padding:13px}.metric{font-size:21px}.grid2,.formgrid{grid-template-columns:1fr}.main{padding:13px}.top{align-items:flex-start}.top .btn{font-size:12px}}
</style></head><body><div id="app"><div class="login card"><div class="brand">METEORS <span>ENERGY</span></div><p class="muted">Secure Solar EPC CRM</p><form id="login"><div class="field"><label>Email</label><input name="email" type="email" required autocomplete="username"></div><div class="field" style="margin-top:12px"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:18px">Sign in</button></form><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" type="button" id="showSetup">Create first admin</button></div><form id="setup" class="hide" style="margin-top:18px"><div class="field"><label>Admin name</label><input name="name" required></div><div class="field" style="margin-top:10px"><label>Admin email</label><input name="email" type="email" required></div><div class="field" style="margin-top:10px"><label>Password (minimum 12 characters)</label><input name="password" type="password" minlength="12" required></div><button class="btn primary" style="width:100%;margin-top:14px">Create admin account</button></form></div></div><div class="toast" id="toast"></div><div class="modal" id="modal"><div class="dialog"><div class="panel-head"><h2 id="modalTitle">Add record</h2><button class="btn" onclick="closeModal()">Close</button></div><form id="recordForm"><div class="formgrid" id="fields"></div><div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn primary">Save record</button></div></form></div></div>
<script>
const labels={dashboard:'Dashboard',leads:'Lead Management',customers:'Customers',quotations:'Quotations',projects:'Projects',followups:'Follow-ups',payments:'Payments',inventory:'Inventory',team:'Team',support:'Support Requests'};
const defs={
leads:[['customer_name','Customer name','text',1],['company','Company','text'],['phone','Mobile','tel'],['whatsapp','WhatsApp','tel'],['email','Email','email'],['city','City / Area','text'],['category','Category','select','Residential,Commercial,Industrial,Institutional'],['capacity_kw','Capacity (kW)','number'],['monthly_bill','Monthly bill (₹)','number'],['source','Lead source','text'],['followup_date','Follow-up date','date'],['status','Status','select','New,Contacted,Interested,Site Visit Scheduled,Quotation Sent,Negotiation,Won,Lost'],['notes','Notes','textarea']],
customers:[['name','Customer name','text',1],['company','Company','text'],['phone','Mobile','tel'],['whatsapp','WhatsApp','tel'],['email','Email','email'],['address','Address','text'],['city','City','text'],['category','Type','select','Residential,Commercial,Industrial,Institutional'],['gstin','GSTIN','text'],['notes','Notes','textarea']],
quotations:[['quotation_no','Quotation number','text',1],['customer_id','Customer ID','text'],['capacity_kw','Capacity kW','number'],['panel_brand','Panel brand','text'],['inverter_brand','Inverter brand','text'],['subtotal','Subtotal ₹','number'],['discount','Discount ₹','number'],['gst_percent','GST %','number'],['total','Total ₹','number'],['validity_date','Valid until','date'],['status','Status','select','Draft,Sent,Approved,Rejected,Expired'],['terms','Terms','textarea']],
projects:[['project_no','Project number','text',1],['customer_id','Customer ID','text'],['location','Location','text'],['capacity_kw','Capacity kW','number'],['value','Project value ₹','number'],['start_date','Start date','date'],['expected_date','Expected completion','date'],['stage','Stage','select','New Project,Site Survey,Technical Approval,Material Procurement,Installation Started,Installation Completed,Testing,Commissioning,Handover,Completed'],['progress','Progress %','number'],['notes','Notes','textarea']],
followups:[['lead_id','Lead ID','text'],['customer_id','Customer ID','text'],['due_at','Due date','date',1],['note','Follow-up note','textarea'],['outcome','Outcome','text']],
payments:[['invoice_no','Invoice number','text'],['customer_id','Customer ID','text'],['project_id','Project ID','text'],['total_amount','Total amount ₹','number',1],['amount','Amount received ₹','number',1],['payment_date','Payment date','date'],['mode','Payment mode','select','UPI,Bank Transfer,Cash,Cheque,Card'],['reference','Transaction reference','text'],['status','Status','select','Pending,Partially Paid,Paid,Overdue']],
inventory:[['sku','SKU','text'],['name','Item name','text',1],['category','Category','select','Solar Panels,Inverters,Mounting Structures,DC Cables,AC Cables,Earthing,Protection Devices,Accessories'],['unit','Unit','text'],['quantity','Quantity','number'],['purchase_price','Purchase price ₹','number'],['supplier','Supplier','text']]
};
let current='dashboard',user=null,items=[];
const api=async(path,opts={})=>{const r=await fetch('/api'+path,{credentials:'include',headers:{'Content-Type':'application/json'},...opts});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed');return data};
const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2600)};
function shell(){document.getElementById('app').innerHTML='<div class="layout"><aside class="side"><div class="brand">METEORS <span>ENERGY</span></div><div class="nav">'+Object.entries(labels).map(([k,v])=>'<button data-page="'+k+'" class="'+(current===k?'active':'')+'">'+v+'</button>').join('')+'<button id="logout">↪ Sign out</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">SOLAR EPC MANAGEMENT</div><h1>'+labels[current]+'</h1><div class="muted">Welcome, '+user.name+'</div></div><button class="btn primary" id="add">＋ Add new</button></div><div id="content"></div></main></div>';document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});document.getElementById('logout').onclick=async()=>{await api('/auth/logout',{method:'POST'});location.reload()};document.getElementById('add').onclick=()=>openForm(current);render()}
async function render(){const el=document.getElementById('content');try{if(current==='dashboard'){const d=await api('/dashboard');el.innerHTML='<div class="cards">'+[['Total Leads',d.leads],['Customers',d.customers],['Active Projects',d.projects-d.completed],['Completed Projects',d.completed],['Quotation Value','₹'+Number(d.quotes).toLocaleString('en-IN')],['Revenue','₹'+Number(d.revenue).toLocaleString('en-IN')],['Pending Payments','₹'+Number(d.pending).toLocaleString('en-IN')],['Upcoming Follow-ups',d.followups]].map(([a,b])=>'<div class="card"><div class="metric-label">'+a+'</div><div class="metric">'+b+'</div><div class="bar"><i style="width:72%"></i></div></div>').join('')+'</div><div class="grid2"><section class="panel"><h2>Business workflow</h2><p class="muted">Enquiry → Follow-up → Quotation → Project → Payment → Handover</p><div class="pill">Live CRM data</div></section><section class="panel"><h2>Quick actions</h2><p class="muted">Create leads, quotations, projects and payment records from the modules.</p></section></div>';return}
if(current==='team'){const d=await api('/team');items=d.items||[]}else{const d=await api('/'+current);items=d.items||[]}el.innerHTML='<section class="panel"><div class="panel-head"><h2>'+labels[current]+'</h2><input class="search" id="search" placeholder="Search records…" style="max-width:240px"></div><div class="table-wrap"><table><thead><tr><th>Record</th><th>Details</th><th>Status / Role</th><th>Created</th><th></th></tr></thead><tbody>'+items.map(x=>{const name=x.customer_name||x.name||x.quotation_no||x.project_no||x.invoice_no||x.subject||x.sku||x.id;const detail=x.phone||x.email||x.city||x.stage||x.category||x.note||x.message||'';const status=x.status||x.role||x.stage||'';return '<tr><td><b>'+esc(name)+'</b></td><td>'+esc(detail)+'</td><td><span class="pill">'+esc(status)+'</span></td><td>'+esc((x.created_at||x.due_at||'').slice(0,10))+'</td><td><button class="btn" data-del="'+x.id+'">Delete</button></td></tr>'}).join('')+'</tbody></table>'+(items.length?'':'<div class="empty">No records yet. Use “Add new” to create the first record.</div>')+'</div></section>';document.getElementById('search').oninput=e=>document.querySelectorAll('tbody tr').forEach(tr=>tr.style.display=tr.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none');document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this record?')){await api('/'+current+'/'+b.dataset.del,{method:'DELETE'});toast('Deleted');render()}})}catch(e){el.innerHTML='<div class="panel">'+esc(e.message)+'</div>'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function openForm(type){if(!defs[type]){toast(type==='team'?'Team creation requires administrator setup.':'This section is view-only for this role.');return}document.getElementById('modalTitle').textContent='Add '+labels[type];document.getElementById('fields').innerHTML=defs[type].map(([n,l,t,extra])=>'<div class="field"><label>'+l+'</label>'+(t==='select'?'<select name="'+n+'">'+String(extra).split(',').map(v=>'<option>'+v+'</option>').join('')+'</select>':t==='textarea'?'<textarea name="'+n+'"></textarea>':'<input name="'+n+'" type="'+t+'" '+(extra===1?'required':'')+'></div>').join('');document.getElementById('modal').classList.add('open');document.getElementById('recordForm').onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(e.target));for(const k in b)if(b[k]==='')delete b[k];try{await api('/'+type,{method:'POST',body:JSON.stringify(b)});closeModal();toast('Record saved');render()}catch(err){toast(err.message)}}}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('showSetup').onclick=()=>document.getElementById('setup').classList.toggle('hide');\ndocument.getElementById('setup').onsubmit=async e=>{e.preventDefault();try{const b=Object.fromEntries(new FormData(e.target));await api('/auth/register',{method:'POST',body:JSON.stringify(b)});toast('Admin created. Please sign in.');e.target.reset();e.target.classList.add('hide')}catch(err){toast(err.message)}};\ndocument.getElementById('login').onsubmit=async e=>{e.preventDefault();try{const f=Object.fromEntries(new FormData(e.target));const d=await api('/auth/login',{method:'POST',body:JSON.stringify(f)});user=d.user;shell()}catch(err){toast(err.message)}};
(async()=>{try{const d=await api('/auth/me');user=d.user;shell()}catch{}})();
</script></body></html>
